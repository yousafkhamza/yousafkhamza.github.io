name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway through.
# (cancel-in-progress: true could kill a deploy mid-flight when two pushes
#  landed close together, which is one way the site ended up blank.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The site only works when Pages publishes this workflow's build. If Pages is
      # set to "Deploy from a branch" it serves the raw repo (blank page) and every
      # deploy here is silently ignored. Try to switch it, otherwise stop loudly.
      - name: Check GitHub Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build_type: $type"
          if [ "$type" = "workflow" ]; then exit 0; fi
          if gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "Switched Pages source to GitHub Actions"
            exit 0
          fi
          echo "::error::GitHub Pages source is '$type', not 'GitHub Actions', so the live site serves the raw repo and shows a blank page. Fix once: repo Settings > Pages > Build and deployment > Source = GitHub Actions, then re-run this workflow."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build (Vite + per-page HTML + sitemap)
        run: npm run build

      # Refuse to publish a broken build instead of finding out from a blank page.
      - name: Check the build output
        run: |
          set -euo pipefail
          for page in index.html experience/index.html projects/index.html services/index.html contact/index.html 404.html sitemap.xml; do
            test -s "dist/$page" || { echo "::error::dist/$page is missing or empty"; exit 1; }
          done
          for asset in $(grep -oE '/assets/[^"]+\.(js|css)' dist/index.html | sort -u); do
            test -s "dist$asset" || { echo "::error::index.html points at $asset but it is not in dist"; exit 1; }
          done
          grep -q 'id="root"' dist/index.html
          echo "build output looks good"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      # only needed for scripts/verify-deploy.sh
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Wait until the live site actually serves this commit and its JS/CSS.
      - name: Verify the live site
        id: verify
        continue-on-error: true
        run: |
          set +e
          bash scripts/verify-deploy.sh
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # The step you used to do by hand: if the first deploy failed or never
      # went live, deploy the same artifact once more and verify again.
      - name: Deploy again
        id: deploy_retry
        if: steps.deploy.outcome == 'failure' || (steps.verify.outcome == 'failure' && steps.verify.outputs.code != '2')
        uses: actions/deploy-pages@v4

      - name: Verify again
        if: steps.deploy_retry.outcome == 'success'
        run: bash scripts/verify-deploy.sh

      - name: Fail if Pages serves the raw repo
        if: steps.verify.outputs.code == '2'
        run: |
          echo "::error::Live site is the raw repository, not the build. Settings > Pages > Source = GitHub Actions."
          exit 1
