    <!-- SPA routing on GitHub Pages: decode the path that public/404.html encoded -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search.slice(1).split("&").map(function (s) { return s.replace(/~and~/g, "&"); }).join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!--
      Stale-asset guard. Right after a deploy, a browser or the GitHub Pages CDN can
      still hold the previous index.html, which points at JS/CSS files the new deploy
      replaced. That 404 used to leave a blank page until someone redeployed.
      If one of our own /assets/ files fails to load, reload once with a cache-buster.
    -->
    <script>
      (function () {
        var KEY = "asset-reload";
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            var src = t && (t.src || t.href);
            if (!src || src.indexOf("/assets/") === -1) return;
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, "1");
            var u = new URL(window.location.href);
            u.searchParams.set("v", Date.now().toString(36));
            window.location.replace(u.toString());
          },
          true
        );
        window.addEventListener("load", function () {
          setTimeout(function () { sessionStorage.removeItem(KEY); }, 4000);
        });
      })();
    </script>
